name: Build

# Publishes every working-branch build as a tagged prerelease with the .ipa
# attached as a release asset, so it downloads directly rather than as the
# zip GitHub wraps around workflow artifacts.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Compile Feather
        run: make iphoneos

      - name: Derive version
        id: version
        run: |
          BASE=$(grep '^FEATHER_PROJECT_VERSION' Feather.xcconfig | cut -d '=' -f2 | tr -d ' ')
          echo "tag=v${BASE}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=Feather ${BASE}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: packages/Feather.ipa
          fail_on_unmatched_files: true
