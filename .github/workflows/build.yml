name: Build

# Release only builds on tags, which is no use while iterating on a fix.
# This builds every push to a working branch and leaves an installable .ipa
# attached to the run.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Compile Feather
        run: make iphoneos

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-${{ github.sha }}
          path: packages/Feather.ipa
          if-no-files-found: error
